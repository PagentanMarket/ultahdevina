<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menunggu Hari Spesial ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Caveat:wght@600&display=swap" rel="stylesheet">
</head>
<body data-page="countdown">
    
    <div id="progress-indicator">Tahap 1/8 : Countdown</div>
    
    <!-- Tombol Musik Khusus Halaman Countdown -->
    <div id="music-control" class="glass-btn">🎵 PLAY MUSIC</div>
    <audio id="bg-music" src="assets/music/awal.mp3" loop preload="auto"></audio>

    <section id="step-countdown" class="glass-card active">
        <h2>🎂 Menuju Hari Spesial Saayang akuh eaakk 😘</h2>
        <div class="countdown-container">
            <div class="time-box"><span id="cd-days">00</span><p>Hari</p></div>
            <div class="time-box"><span id="cd-hours">00</span><p>Jam</p></div>
            <div class="time-box"><span id="cd-mins">00</span><p>Menit</p></div>
            <div class="time-box"><span id="cd-secs">00</span><p>Detik</p></div>
        </div>
        <p class="small-text">Sabaar yee tunggu sampai waktunya tiba ya... karena sejatinya orang sabar disayang akoeeh ❤️</p>
    </section>

    <script src="script.js"></script>
</body>
</html>
